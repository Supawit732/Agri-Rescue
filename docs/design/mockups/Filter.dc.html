<button type="button" style="height: 36px; padding: 0 14px; border-radius: 18px; border: 1px solid #DCE2D6; background: #FFFFFF; color: #1B241C; font-family: inherit; font-size: 14px">น้อยกว่า 48 ชม.</button>
